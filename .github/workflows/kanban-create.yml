
name: Recriar Kanban HeadRush(Não usar se estiver criado!)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanban-recreate
  cancel-in-progress: false

jobs:
  recreate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests pyyaml

      - name: Validar arquivos
        run: |
          test -f .github/scripts/recreate_kanban.py
          test -f .github/kanban-status.yml

      - name: Recriar Kanban
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: Gu1lz
          PROJECT_NUMBER: "5"
          CONFIRM_RECREATE: "true"
        run: python .github/scripts/recreate_kanban.py
