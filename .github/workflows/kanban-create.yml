
name: Recriar Kanban HeadRush (Não usar se estiver criado!)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recreate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests pyyaml

      - name: Sobrescrever Kanban com o YAML
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: Gu1lz
          PROJECT_NUMBER: "5"
        run: |
          python - <<'PY'
          import os
          import requests
          import yaml
          import unicodedata

          token = os.environ["GH_TOKEN"]
          owner = os.environ["PROJECT_OWNER"]
          number = int(os.environ["PROJECT_NUMBER"])
          endpoint = "https://api.github.com/graphql"

          def graphql(query, variables=None):
              response = requests.post(
                  endpoint,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  json={
                      "query": query,
                      "variables": variables or {},
                  },
                  timeout=60,
              )
              response.raise_for_status()
              result = response.json()
              if result.get("errors"):
                  raise RuntimeError(result["errors"])
              return result["data"]

          def normalize(value):
              value = unicodedata.normalize("NFKD", str(value or ""))
              return "".join(
                  char for char in value
                  if not unicodedata.combining(char)
              ).strip().lower()

          with open(".github/kanban-status.yml", encoding="utf-8") as f:
              config = yaml.safe_load(f)

          tasks = config.get("tasks", [])
          if not tasks:
              raise RuntimeError("O YAML não contém tarefas. Abortando para evitar apagar o quadro.")

          project = graphql("""
            query($owner: String!, $number: Int!) {
              user(login: $owner) {
                projectV2(number: $number) {
                  id
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on DraftIssue { title }
                        ... on Issue { title }
                        ... on PullRequest { title }
                      }
                    }
                    pageInfo {
                      hasNextPage
                      endCursor
                    }
                  }
                  fields(first: 50) {
                    nodes {
                      __typename
                      ... on ProjectV2Field { id name }
                      ... on ProjectV2SingleSelectField {
                        id name options { id name }
                      }
                    }
                  }
                }
              }
            }
          """, {"owner": owner, "number": number})["user"]["projectV2"]

          if not project:
              raise RuntimeError("GitHub Project não encontrado.")

          if project["items"]["pageInfo"]["hasNextPage"]:
              raise RuntimeError(
                  "O projeto tem mais de 100 itens. Nenhuma alteração foi feita; "
                  "é necessário paginar os itens antes de recriar o quadro."
              )

          project_id = project["id"]
          fields = {
              normalize(field["name"]): field
              for field in project["fields"]["nodes"]
          }

          # Remove todos os itens existentes do Project.
          for item in project["items"]["nodes"]:
              graphql("""
                mutation($project: ID!, $item: ID!) {
                  deleteProjectV2Item(input: {
                    projectId: $project,
                    itemId: $item
                  }) {
                    deletedItemId
                  }
                }
              """, {"project": project_id, "item": item["id"]})
              content = item.get("content") or {}
              print(f"Item removido do Project: {content.get('title', item['id'])}")

          statuses = {
              str(status["id"]): str(status["name"])
              for status in config.get("statuses", [])
          }

          def set_status(item_id, status_id):
              field = fields.get("status")
              if not field:
                  print("Aviso: campo Status não encontrado.")
                  return

              aliases = {
                  "fila": ["backlog"],
                  "a_fazer": ["ready", "todo", "to do"],
                  "em_andamento": ["in progress", "doing"],
                  "em_revisao": ["in review", "review"],
                  "concluido": ["done", "complete", "completed"],
              }

              desired = normalize(statuses.get(status_id, status_id))
              candidates = [desired] + aliases.get(status_id, [])
              option = next(
                  (
                      opt for opt in field.get("options", [])
                      if normalize(opt["name"]) in candidates
                  ),
                  None,
              )

              if not option:
                  print(
                      f"Aviso: status '{status_id}' não possui opção "
                      "equivalente no Project."
                  )
                  return

              graphql("""
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldSingleSelectValue(input: {
                    projectId: $project,
                    itemId: $item,
                    fieldId: $field,
                    singleSelectOptionId: $option
                  }) {
                    projectV2Item { id }
                  }
                }
              """, {
                  "project": project_id,
                  "item": item_id,
                  "field": field["id"],
                  "option": option["id"],
              })

          def set_date(item_id, field_name, date):
              field = fields.get(normalize(field_name))
              if not field or not date:
                  return

              graphql("""
                mutation($project: ID!, $item: ID!, $field: ID!, $date: Date!) {
                  updateProjectV2ItemFieldDateValue(input: {
                    projectId: $project,
                    itemId: $item,
                    fieldId: $field,
                    date: $date
                  }) {
                    projectV2Item { id }
                  }
                }
              """, {
                  "project": project_id,
                  "item": item_id,
                  "field": field["id"],
                  "date": str(date),
              })

          for task in tasks:
              title = str(task["title"])
              start = task.get("start_date") or task.get("date") or ""
              due = task.get("due_date") or task.get("date") or ""
              status = str(task.get("status", "a_fazer"))
              notes = str(task.get("notes", ""))

              body = (
                  f"Início: {start}\n"
                  f"Prazo: {due}\n"
                  f"Status planejado: {status}\n\n"
                  f"{notes}"
              )

              created = graphql("""
                mutation($project: ID!, $title: String!, $body: String!) {
                  addProjectV2DraftIssue(input: {
                    projectId: $project,
                    title: $title,
                    body: $body
                  }) {
                    projectItem { id }
                  }
                }
              """, {
                  "project": project_id,
                  "title": title,
                  "body": body,
              })["addProjectV2DraftIssue"]["projectItem"]

              item_id = created["id"]
              set_status(item_id, status)
              set_date(item_id, "start date", start)
              set_date(item_id, "target date", due)
              print(f"Cartão criado: {title}")

          print(f"Kanban recriado com {len(tasks)} tarefas do YAML.")
          PY
